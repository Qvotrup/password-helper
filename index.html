<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
          script-src 'self';
          style-src 'self';
          connect-src 'none';
          img-src 'none';
          form-action 'none';
          base-uri 'none';
          object-src 'none';
          frame-src 'none';
          ">
    <title>Password Helper</title>
    <link rel="stylesheet" href="style.css">
    <script src="vendor/zxcvbn.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
<main class="container">
    <h1> Password Helper </h1>
    <p class="privacy-info">Everything is done in-browser: passwords are not stored or sent to a server.</p>


    <div class="tools">
        <section>
            <h2>Password strength checker</h2>
            <div class="input-row">
                <div class="input-wrapper">
                    <input id="password" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                           maxlength="256"
                           placeholder="enter password">
                    <button id="toggle-password" type="button"
                            class="toggle-visibility">hide
                    </button>
                </div>
            </div>
            <p id="strength">Enter your password to check strength</p>
        </section>

        <section>
            <h2>Password generator</h2>
            <div class="input-row">
                <div class="input-wrapper">
                    <input id="generated" type="text" autocomplete="off" spellcheck="false"
                           placeholder="generated password">
                    <button id="toggle-generated" type="button"
                            class="toggle-visibility">hide
                    </button>
                </div>
                <button id="generate" type="button">Generate</button>
            </div>
            <fieldset>
                <div class="length-control">
                    <label for="length">Length <span id="length-value">12</span></label>
                    <input type="range" id="length" min="8" max="24" value="12" step="1">
                </div>
                <div class="character-options">
                    <label class="check"><input type="checkbox" id="lower" checked>Include lowercase letters</label>
                    <label class="check"><input type="checkbox" id="numbers" checked>Include numbers</label>
                    <label class="check"><input type="checkbox" id="upper" checked>Include uppercase letters</label>
                    <label class="check"><input type="checkbox" id="symbols" checked>Include symbols</label>
                </div>
            </fieldset>

        </section>
    </div>

</main>
</body>
</html>
