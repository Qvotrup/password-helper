<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
          script-src 'self';
          style-src 'self';
          connect-src 'none';
          img-src 'none';
          form-action 'none';
          base-uri 'none';
          object-src 'none';
          frame-src 'none';
          ">
    <title>Password Helper</title>
    <link rel="stylesheet" href="style.css">
    <script src="vendor/zxcvbn.js" defer></script>
    <script src="js/generator.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
<main class="container">
    <h1> Password Helper </h1>
    <p class="privacy-info">Everything is done in-browser: passwords are not stored or sent to a server.</p>
    <section>
        <h2>Password strength checker. Powered by zxcvbn</h2>
        <label for="password">Password</label>
        <div class="input-row">
            <input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="256" placeholder="enter password">
            <button id="toggle-password" type="button">Show/hide</button>
        </div>
        <p id="strength">Enter your password to check strength</p>
    </section>

    <h2>Password generator</h2>
    <label for="generated">Generated password</label>
    <div class="input-row">
        <input id="generated" type="password" autocomplete="off" spellcheck="false">
        <button id="toggle-generated" type="button">Show/hide</button>
    </div>
    <button id="generate" type="button">Generate password</button>
    <section>
        <fieldset>
        <label for="length">Length <span id="length-value">20</span></label>
        <input type="range" id="length" min="8" max="24" value="12" step="1">
        <br>
        <label class="check"><input type="checkbox" id="lower" checked>Include lowercase letters</label>
        <label class="check"><input type="checkbox" id="upper" checked>Include uppercase letters</label>
        <label class="check"><input type="checkbox" id="numbers" checked>Include numbers</label>
        <label class="check"><input type="checkbox" id="symbols" checked>Include symbols</label>
    </fieldset>
    </section>


</main>
</body>
</html>
